<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gAIn. - Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #1e1e1e;
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
            color: #ffffff; overflow: hidden; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .terminal-window {
            width: 95%; height: 90%; background-color: rgba(20, 20, 20, 0.95);
            border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden;
        }
        .title-bar { background-color: #2d2d2d; padding: 8px 15px; display: flex; align-items: center; border-bottom: 1px solid #1a1a1a; }
        .traffic-lights { display: flex; gap: 8px; margin-right: 15px; }
        .light { width: 12px; height: 12px; border-radius: 50%; }
        .red { background-color: #ff5f56; } .yellow { background-color: #ffbd2e; } .green { background-color: #27c93f; }
        .title { color: #888; font-size: 14px; flex-grow: 1; text-align: center; }
        .terminal-body { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 16px; line-height: 1.6; }
        .input-line { display: flex; align-items: center; padding: 10px 15px; border-top: 1px solid #333; background-color: #1a1a1a; }
        .prompt { color: rgb(59, 219, 107); margin-right: 10px; white-space: nowrap; font-size: 16px; }
        .terminal-input { background: transparent; border: none; color: #fff; font-family: inherit; font-size: 16px; outline: none; flex-grow: 1; caret-color: rgb(59, 219, 107); }
        .freeze-btn { background: #333; color: #fff; border: 1px solid #555; padding: 5px 15px; margin-left: 15px; cursor: pointer; border-radius: 4px; font-family: inherit; font-size: 14px; transition: 0.2s; }
        .freeze-btn:hover { background: rgb(59, 219, 107); color: #000; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #1a1a1a; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .md-content { color: #ffffff; }
        .md-content h1, .md-content h2, .md-content h3 { color: rgb(59, 219, 107); margin-top: 20px; }
        .md-content p { margin: 5px 0; } .md-content strong { color: rgb(59, 219, 107); }
        .md-content em { color: #aaa; font-style: normal; } .md-content hr { border-color: #333; margin: 15px 0; }
        .md-content ul { padding-left: 20px; } .md-content li { margin-bottom: 5px; }
        .footer-bar { background-color: #2d2d2d; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1a1a1a; font-size: 14px; }
        .footer-bar a { color: #888; text-decoration: none; transition: color 0.2s; }
        .footer-bar a:hover { color: rgb(59, 219, 107); }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="terminal-window">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="light red"></div><div class="light yellow"></div><div class="light green"></div>
            </div>
            <div class="title">gAIn. — bash — 80x24</div>
        </div>
        <div class="terminal-body" id="terminal-body">
            <div>Welcome to gAIn. Terminal. Enter ticker (e.g., RELIANCE, NIFTY). Use the exact ticker, like BAJFINANCE, not BAJAJFINANCE.<br><span class="blink">_</span></div>
        </div>
        <div class="input-line">
            <span class="prompt">vihaan@gAIn:~$</span>
            <input type="text" class="terminal-input" id="ticker-input" autofocus placeholder="Type ticker only (e.g., RELIANCE, NIFTY) and press ENTER.">
            <button class="freeze-btn" id="freeze-btn">Freeze</button>
        </div>
        <div class="footer-bar">
            <a href="https://github.com/aurumz-rgb" target="_blank">GitHub</a>
            <a href="documentation.html">Documentation</a>
            <a href="https://aurumz-rgb.github.io" target="_blank">Made with 🤍 by V.S</a>
        </div>
    </div>

    <script>
        let pollingInterval = null;
        let isFetching = false;
        let isFrozen = false;
        let currentTicker = "";
        let terminal_text = "";
        
        const input = document.getElementById('ticker-input');
        const body = document.getElementById('terminal-body');
        const freezeBtn = document.getElementById('freeze-btn');
        
        const BACKEND_URL = "http://localhost:8000"; 
        //  const BACKEND_URL = "render url"; 
        // Do this if you deply the backend to your own API backend and // the localhost:3000

        setInterval(() => {
            const clock = document.getElementById('live-clock');
            if (clock) {
                const now = new Date();
                clock.innerText = now.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            }
        }, 1000);

        freezeBtn.addEventListener('click', () => {
            if (isFrozen) {
                isFrozen = false;
                freezeBtn.innerText = 'Freeze';
                if (currentTicker) {
                    fetchData(currentTicker, false);
                    pollingInterval = setInterval(() => {
                        if (!isFrozen) fetchData(currentTicker, false);
                    }, 5000);
                }
            } else {
                isFrozen = true;
                freezeBtn.innerText = 'Resume';
                if (pollingInterval) clearInterval(pollingInterval);
            }
        });

        async function fetchData(ticker, showLogs) {
            if (isFetching) return;
            isFetching = true;
            
            if (showLogs) {
                terminal_text = `[SYSTEM] Connecting to the backend SERVER...`;
                renderTerminalLogs();
            }
            
            try {
                const res = await fetch(`${BACKEND_URL}/get_live_data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: ticker, show_logs: showLogs })
                });

                if (showLogs) {
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (line.startsWith("LOG: ")) {
                                terminal_text += `\n${line.substring(5)}`;
                                renderTerminalLogs();
                            } else if (line.startsWith("FINAL: ")) {
                                const final_json = line.substring(7);
                                try {
                                    const final_data = JSON.parse(final_json);
                                    renderData(final_data);
                                } catch (e) {
                                    console.error("Error parsing final JSON", e);
                                }
                            }
                        }
                    }
                } else {
                   
                    const data = await res.json();
                    renderData(data);
                }
            } catch (e) {
                if (!pollingInterval) {
                    body.innerHTML = `<div style="color: red;">Connection Error: ${e}<br>Make sure backend is running.</div>`;
                }
            } finally {
                isFetching = false;
            }
        }

        function renderTerminalLogs() {
            body.innerHTML = `<pre style="white-space: pre-wrap; word-wrap: break-word; margin: 0; color: rgb(59, 219, 107);">${terminal_text}<span class="blink">_</span></pre>`;
            body.scrollTop = body.scrollHeight;
        }

        function renderData(data) {
            const reply = data.reply || "Error: No reply";
            const shortChart = data.short_chart_data || [];
            const longChart = data.long_chart_data || [];
            const targets = data.targets || {};

            const chunks = reply.split(/(\[CHART:[A-Z_]+\])/);
            
            const oldScrollTop = body.scrollTop;
            const isScrolledToBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 2;
            
            let html = '';
            chunks.forEach(chunk => {
                if (chunk.startsWith('[CHART:')) {
                    const chartType = chunk.match(/CHART:([A-Z_]+)/)[1];
                    const h = chartType === 'LONG_TERM' ? 400 : (chartType === 'PRICE' ? 350 : 250);
                    html += `<div id="chart-${chartType}" style="width: 100%; height: ${h}px; margin: 10px 0; overflow: hidden;"></div>`;
                } else {
                    html += marked.parse(chunk);
                }
            });
            
            body.innerHTML = html;
            
            if (isScrolledToBottom) {
                body.scrollTop = body.scrollHeight;
            } else {
                body.scrollTop = oldScrollTop;
            }
            
            if (chunks.includes('[CHART:PRICE]')) renderPriceChart('chart-PRICE', shortChart, targets);
            if (chunks.includes('[CHART:RSI]')) renderRsiChart('chart-RSI', shortChart);
            if (chunks.includes('[CHART:STOCH_RSI]')) renderStochRsiChart('chart-STOCH_RSI', shortChart);
            if (chunks.includes('[CHART:MACD]')) renderMacdChart('chart-MACD', shortChart);
            if (chunks.includes('[CHART:LONG_TERM]')) renderLongTermChart('chart-LONG_TERM', longChart);
        }

        function plotDefaults(h) {
            const w = document.getElementById('terminal-body').clientWidth - 40; 
            return {
                autosize: false, width: w, height: h,
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#ffffff', family: 'Menlo, monospace', size: 12 },
                margin: { l: 40, r: 20, t: 20, b: 30 }
            };
        }

        function renderPriceChart(id, data, targets) {
            if(!data || data.length === 0) return;
            const x = data.map(d => d.time);
            const traces = [
                { x: x, y: data.map(d => d.upper_band), mode: 'lines', line: {color: 'rgba(255,255,255,0.2)'}, name: 'Upper Band' },
                { x: x, y: data.map(d => d.lower_band), mode: 'lines', line: {color: 'rgba(255,255,255,0.2)'}, fill: 'tonexty', fillcolor: 'rgba(100,100,100,0.2)', name: 'Lower Band' },
                { x: x, y: data.map(d => d.vwap), mode: 'lines', line: {color: 'orange', width: 2}, name: 'VWAP' },
                { x: x, y: data.map(d => d.price), mode: 'lines', line: {color: 'rgb(59, 219, 107)', width: 2}, name: 'Price' }
            ];
            const shapes = [];
            if(targets.lowest_bid) shapes.push({type: 'line', x0: x[0], x1: x[x.length-1], y0: targets.lowest_bid, y1: targets.lowest_bid, line: {color: 'blue', dash: 'dash'}});
            if(targets.highest_sell) shapes.push({type: 'line', x0: x[0], x1: x[x.length-1], y0: targets.highest_sell, y1: targets.highest_sell, line: {color: 'red', dash: 'dash'}});
            Plotly.newPlot(id, traces, {...plotDefaults(350), shapes: shapes, showlegend: false});
        }

        function renderRsiChart(id, data) {
            if(!data || data.length === 0) return;
            const x = data.map(d => d.time);
            const traces = [{ x: x, y: data.map(d => d.rsi), mode: 'lines', line: {color: 'purple', width: 2}, name: 'RSI' }];
            const shapes = [
                {type: 'line', x0: x[0], x1: x[x.length-1], y0: 70, y1: 70, line: {color: 'red', dash: 'dot'}},
                {type: 'line', x0: x[0], x1: x[x.length-1], y0: 30, y1: 30, line: {color: 'green', dash: 'dot'}}
            ];
            Plotly.newPlot(id, traces, {...plotDefaults(250), shapes: shapes, yaxis: {range: [0, 100]}, showlegend: false});
        }

        function renderStochRsiChart(id, data) {
            if(!data || data.length === 0) return;
            const x = data.map(d => d.time);
            const traces = [{ x: x, y: data.map(d => d.stoch_rsi), mode: 'lines', line: {color: 'cyan', width: 2}, name: 'Stoch RSI' }];
            const shapes = [
                {type: 'line', x0: x[0], x1: x[x.length-1], y0: 0.8, y1: 0.8, line: {color: 'red', dash: 'dot'}},
                {type: 'line', x0: x[0], x1: x[x.length-1], y0: 0.2, y1: 0.2, line: {color: 'green', dash: 'dot'}}
            ];
            Plotly.newPlot(id, traces, {...plotDefaults(250), shapes: shapes, yaxis: {range: [0, 1]}, showlegend: false});
        }

        function renderMacdChart(id, data) {
            if(!data || data.length === 0) return;
            const x = data.map(d => d.time);
            const hist = data.map(d => d.macd - d.signal);
            const traces = [
                { x: x, y: hist, type: 'bar', marker: {color: 'rgba(100,100,100,0.5)'}, name: 'Hist' },
                { x: x, y: data.map(d => d.macd), mode: 'lines', line: {color: 'blue', width: 2}, name: 'MACD' },
                { x: x, y: data.map(d => d.signal), mode: 'lines', line: {color: 'orange', width: 2}, name: 'Signal' }
            ];
            Plotly.newPlot(id, traces, {...plotDefaults(250), showlegend: false});
        }

        function renderLongTermChart(id, data) {
            if(!data || data.length === 0) return;
            const x = data.map(d => d.time);
            const traces = [
                { x: x, y: data.map(d => d.price), mode: 'lines', line: {color: 'rgb(59, 219, 107)', width: 2}, name: 'Price' },
                { x: x, y: data.map(d => d.sma_50), mode: 'lines', line: {color: 'blue', dash: 'dash', width: 1.5}, name: '50 DMA' },
                { x: x, y: data.map(d => d.sma_200), mode: 'lines', line: {color: 'red', dash: 'dash', width: 1.5}, name: '200 DMA' }
            ];
            Plotly.newPlot(id, traces, {...plotDefaults(400), showlegend: true});
        }

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const ticker = input.value.trim().toUpperCase();
                if (!ticker) return;
                
                currentTicker = ticker;
                if (pollingInterval) clearInterval(pollingInterval);
                
         
                fetchData(ticker, true);
                

              
                pollingInterval = setInterval(() => {
                    if (!isFrozen) {
                        fetchData(ticker, false); 
                    }
                }, 5000); 
            }
        });
    </script>
</body>
</html>
