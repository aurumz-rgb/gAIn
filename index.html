<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gAIn. - Terminal</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="terminal-window">
        <div class="title-bar">
            <div class="traffic-lights">
                <div class="light red"></div><div class="light yellow"></div><div class="light green"></div>
            </div>
            <div class="title">gAIn. — bash — 80x24</div>
        </div>
        <div class="terminal-body" id="terminal-body">
            <div>Welcome to gAIn. Terminal. Enter ticker (e.g., RELIANCE). Use the exact ticker, like BAJFINANCE, not BAJAJFINANCE.<br><span class="blink">_</span></div>
        </div>
        <div class="input-line">
            <span class="prompt">terminal@gAIn:~$</span>
            <input type="text" class="terminal-input" id="ticker-input" autofocus placeholder="Type ticker (e.g., TCS, RELIANCE) and press ENTER.">
            <button class="freeze-btn" id="freeze-btn">Freeze</button>
        </div>
        <div class="footer-bar">
            <a href="https://github.com/aurumz-rgb" target="_blank">GitHub</a>
            <a href="documentation.html">Documentation</a>
            <a href="https://aurumz-rgb.github.io" target="_blank">Website</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
